spring:
  application:
    name: aibase
  datasource:
    url: jdbc:sqlite:${AIBASE_DATA_DIR:./data}/aibase.db
    driver-class-name: org.sqlite.JDBC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 模型文件可能达 GB 级
      max-file-size: ${AIBASE_MAX_FILE_SIZE:20GB}
      max-request-size: ${AIBASE_MAX_REQUEST_SIZE:20GB}

server:
  port: ${AIBASE_PORT:18081}

aibase:
  # API Key 加密密钥（Base64 编码 32 字节 AES-256 密钥）；生产环境必须通过环境变量注入
  encryption-key: ${AIBASE_ENC_KEY:}
  # 数据目录（SQLite 文件与插件目录的根）
  data-dir: ${AIBASE_DATA_DIR:./data}
  # 管理认证：设置任一项后管理接口需认证（登录密码 / 固定管理 Token）
  admin-password: ${AIBASE_ADMIN_PASSWORD:}
  admin-key: ${AIBASE_ADMIN_KEY:}

logging:
  level:
    cn.aibase: INFO
