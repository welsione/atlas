docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
          - "AGENTS.md"
          - "CHANGELOG.md"

core:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/core/**/*"
          - "packages/types/**/*"

web:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/web/**/*"

plugins:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/**/*"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - "package.json"
          - "package-lock.json"
