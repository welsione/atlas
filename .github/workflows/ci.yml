name: CI

# 每次推送与 PR 都跑：文档规范 → 提交规范 → 类型检查 → 构建 → 测试。
# 镜像构建/推送由 build-push.yml 负责（master/tag 触发），与本流水线互补。
# AI 审查由 opencode-review.yml 负责；版本发布由 release.yml（release-please）负责。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: Commitlint
        uses: wwh/commitlint@v1
        with:
          commitlint-config: '{"extends":["@commitlint/config-conventional"]}'

      - name: Type check
        run: npm run typecheck

      - name: Build (types + core)
        run: npm run build

      - name: Test (Jest + Vitest)
        run: npm test
