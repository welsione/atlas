name: CI

# 每次推送与 PR 都跑：安装 → 类型检查 → 构建 → 测试。
# 镜像构建/推送由 build-push.yml 负责（master/tag 触发），与本流水线互补。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (types + core)
        run: npm run build

      - name: Test (Jest + Vitest)
        run: npm test
