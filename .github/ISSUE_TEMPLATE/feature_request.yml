name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先搜索已有 issue，确认未被提出。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的痛点或限制（缺少什么能力）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望如何解决，可附 API/UI 草图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他方案及其取舍
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 核心框架
        - 插件能力
        - 数据集
        - 前端 UI
        - 运维/部署
        - 文档
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 相关链接、截图、使用场景
