name: Bug 报告
description: 报告一个缺陷或异常行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请尽量提供完整信息以便复现。
        > **安全漏洞请勿在此提交**，请走 [SECURITY.md](../../SECURITY.md) 的私下报告流程。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行的 Atlas 版本（`package.json` 的 version）
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 后端核心框架（packages/core）
        - 前端（packages/web）
        - 插件（plugins/*）
        - 数据集
        - 安全/鉴权
        - 部署/Docker
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么、预期是什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现步骤（命令、请求、配置）
      placeholder: |
        1. 配置 ATLAS_ENC_KEY=...
        2. 执行 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: 粘贴相关日志或错误堆栈（注意脱敏，勿含密钥/token）
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 环境信息
      placeholder: |
        - OS: macOS 14 / Ubuntu 22.04
        - Node: v22.x
        - 部署方式: 本地 dev / Docker
