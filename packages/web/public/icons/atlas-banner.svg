<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="atlas-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#5BB9FF"/>
    </linearGradient>
    <filter id="banner-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B4FC9" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- atlas.svg 图标（同一份三三角代码：加粗左腿/右腿 + 斜置横梁，白底上直接渲染，无独立白底 rect） -->
  <g filter="url(#banner-shadow)">
    <polygon points="50,16 12,80 48,48" fill="#1E6FE8"/>
    <polygon points="50,16 88,80 55,49" fill="#2B86EF"/>
    <polygon points="55,49 95,52 12,80" fill="#5BB9FF"/>
  </g>

  <!-- Atlas 艺术字：衬线斜体 + 品牌渐变 -->
  <text x="124" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="700" fill="url(#atlas-text)" letter-spacing="1">Atlas</text>
</svg>
