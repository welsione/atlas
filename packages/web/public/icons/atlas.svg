<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="atlas-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B4FC9" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 白色圆角底 -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#ffffff"/>

  <!-- 三个三角形组成的字母 A（Atlas）：左右腿 + 横梁 -->
  <g filter="url(#atlas-shadow)">
    <!-- 左腿：顶点 → 左脚 → 梁左端（加粗） -->
    <polygon points="50,16 12,80 42,52" fill="#1E6FE8"/>
    <!-- 右腿：顶点 → 右脚 → 梁右端（加粗） -->
    <polygon points="50,16 88,80 58,52" fill="#2B86EF"/>
    <!-- 横梁：倒三角斜置，尖端偏左 -->
    <polygon points="42,52 85,38 12,80" fill="#5BB9FF"/>
  </g>
</svg>
