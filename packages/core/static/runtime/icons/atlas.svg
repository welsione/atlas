<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="atlas-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B4FC9" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 白色圆角底 -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#ffffff"/>

  <!-- 低多边形字母 A（Atlas），三角形拼合 -->
  <g filter="url(#atlas-shadow)">
    <!-- 顶部尖角 -->
    <polygon points="50,22 40,30 50,35" fill="#5BB9FF"/>
    <polygon points="50,22 50,35 60,30" fill="#3D9BF5"/>
    <polygon points="50,22 40,30 38,40" fill="#1E6FE8"/>
    <polygon points="50,22 60,30 62,40" fill="#4FA9F7"/>
    <!-- 左腿 -->
    <polygon points="38,40 12,82 28,60" fill="#0B4FC9"/>
    <polygon points="28,60 12,82 32,64" fill="#3D9BF5"/>
    <polygon points="38,40 35,58 28,60" fill="#5BB9FF"/>
    <!-- 横梁 -->
    <polygon points="35,58 65,58 56,64" fill="#3D9BF5"/>
    <polygon points="35,58 56,64 32,64" fill="#1E6FE8"/>
    <polygon points="32,64 56,64 50,82" fill="#5BB9FF"/>
    <!-- 右腿 -->
    <polygon points="62,40 65,58 72,60" fill="#3D9BF5"/>
    <polygon points="62,40 72,60 88,82" fill="#5BB9FF"/>
    <polygon points="72,60 88,82 50,82" fill="#2B86EF"/>
  </g>
</svg>
